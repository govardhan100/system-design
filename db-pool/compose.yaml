services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in db-pool/.env}
    ports:
      - "127.0.0.1:${DB_POOL_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in db-pool/.env}@db:5432/mydb
      POOL_MIN_SIZE: ${POOL_MIN_SIZE:-2}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}
      POOL_WAIT_TIMEOUT: ${POOL_WAIT_TIMEOUT:-2}
    ports:
      - "127.0.0.1:${APP_PORT:-8003}:8000"
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    profiles: ["test"]
    build: .
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in db-pool/.env}@db:5432/mydb
      POOL_MIN_SIZE: 2
      POOL_MAX_SIZE: 10
      POOL_WAIT_TIMEOUT: 2
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

networks:
  frontend:
    name: db-pool-frontend
  backend:
    name: db-pool-backend
    internal: true

volumes:
  postgres-data: